version: "1.0"

server:
  port: 8080
  host: "0.0.0.0"
  cors:
    origin: "*"

auth:
  issuer: "https://auth.techies.tokyo"
  audience: "zta-mcp-gateway"
  local_jwt_secret_env: "GATEWAY_JWT_SECRET"
  clients:
    - client_id: "macosui-analyst"
      client_secret: "analyst-secret-2026"
      roles: ["analyst"]
    - client_id: "macosui-admin"
      client_secret: "admin-secret-2026"
      roles: ["admin"]

catalog:
  definitions_file: "./catalog-definitions.yaml"

secrets:
  provider: "local"

# ==============================================================================
# Upstream MCP Servers (Full Sample Mode)
# NPB公式戦データ(MariaDB)およびデジタル庁行政手続きMCPを含むフルスタック設定です。
# ==============================================================================
upstreams:
  - id: "catalog"
    path: "/mcp/catalog"
    target: "internal://catalog"
    description: "Meta-Catalog MCP for Database Schemas and GenUI Specifications"
    policies:
      role_mappings:
        guest:
          allowed_tools: []
        analyst:
          allowed_tools:
            - "list_catalog"
            - "get_catalog_detail"
        admin:
          allowed_tools:
            - "*"

  - id: "mariadb"
    path: "/mcp/mariadb"
    target: "http://mariadb-mcp:33060/mcp"
    description: "MariaDB NPB Official Dataset MCP Server with ZTA Protection"
    policies:
      role_mappings:
        guest:
          allowed_tools: []
        analyst:
          allowed_tools:
            - "read_query"
            - "list_tables"
            - "describe_table"
        admin:
          allowed_tools:
            - "*"
      firewall:
        enforce_sql_check: true
        restricted_roles:
          - "analyst"
        allowed_statements:
          - "SELECT"
          - "SHOW"
          - "DESC"
        deny_statements:
          - "INSERT"
          - "UPDATE"
          - "DELETE"
          - "DROP"
          - "ALTER"
          - "TRUNCATE"
          - "GRANT"
          - "REVOKE"

  - id: "admin-procedures"
    path: "/mcp/admin-procedures"
    target: "http://admin-procedures-mcp:33070/mcp"
    description: "Digital Agency Administrative Procedures MCP Server with ZTA Protection"
    policies:
      role_mappings:
        guest:
          allowed_tools: []
        analyst:
          allowed_tools:
            - "list_datasets"
            - "inspect_dataset"
            - "query_records"
            - "summarize_records"
        admin:
          allowed_tools:
            - "*"
