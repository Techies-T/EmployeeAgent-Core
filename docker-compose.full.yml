version: '3.8'

volumes:
  mariadb_npb_data:

services:
  # ============================================================================
  # 1. EmployeeAgent-Core (MacOSUI Web & API Server)
  # ============================================================================
  macosui:
    build: .
    container_name: macosui-local
    ports:
      - "8080:8080"
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    env_file:
      - server/development.env
    environment:
      - PORT=8080
      - DB_TYPE=sqlite
      - ZTA_GATEWAY_URL=http://zta-mcp-gateway:8080
      - VIRTUAL_OFFICE_PLUGIN_URL=http://ea-widget-virtual-office:8091
      - MCP_CHAT_PLUGIN_URL=http://ea-widget-mcp-chat:8092
      - EA_CORE_INTERNAL_URL=http://macosui-local:8080
      - PLUGIN_UPDATER_URL=http://ea-plugin-updater:8099
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - zta-gateway
    restart: unless-stopped

  # ============================================================================
  # 2. ZTA-MCP-Gateway (Zero Trust OAuth JWT + SSE Proxy & SQL Firewall)
  # ============================================================================
  zta-gateway:
    build:
      context: ./zta-mcp-stack
      dockerfile: Dockerfile
    image: techies-t/zta-mcp-gateway:latest
    container_name: zta-mcp-gateway
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - NODE_ENV=production
      - GATEWAY_CONFIG_PATH=/app/config/gateway-config.yaml
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET:-super-secret-key-for-local-docker}
    volumes:
      - ./zta-mcp-stack/config/gateway-config.sample.yaml:/app/config/gateway-config.yaml:ro
      - ./zta-mcp-stack/config/catalog-definitions.yaml:/app/config/catalog-definitions.yaml:ro
    depends_on:
      - mariadb-mcp
      - admin-procedures-mcp
      - aurora-rds-mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================================
  # 3. NPB サンプル用 MariaDB 10.11 (2024-2026年 プロ野球公式戦データ)
  # ============================================================================
  test_mariadb:
    image: mariadb:10.11
    container_name: test_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: my-secret-pw
      MARIADB_DATABASE: testdb
      MARIADB_USER: testuser
      MARIADB_PASSWORD: testpassword
    ports:
      - "3306:3306"
    volumes:
      - ./scripts/setup_npb_data.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mariadb_npb_data:/var/lib/mysql
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================================
  # 4. MariaDB MCP サーバー
  # ============================================================================
  mariadb-mcp:
    build:
      context: ./zta-mcp-stack/services/mariadb-mcp
      dockerfile: Dockerfile
    image: techies-t/mariadb-mcp:latest
    container_name: mariadb-mcp
    restart: unless-stopped
    ports:
      - "33060:33060"
    environment:
      - NODE_ENV=production
      - MCP_PORT=33060
      - MCP_HOST=0.0.0.0
      - DB_HOST=test_mariadb
      - DB_PORT=3306
      - DB_USER=testuser
      - DB_PASSWORD=testpassword
      - DB_NAME=testdb
    depends_on:
      - test_mariadb
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================================
  # 5. デジタル庁 行政手続等棚卸調査 MCP サーバー
  # ============================================================================
  admin-procedures-mcp:
    build:
      context: ./zta-mcp-stack/services/administrative-procedures-mcp
      dockerfile: Dockerfile
    image: techies-t/admin-procedures-mcp:latest
    container_name: admin-procedures-mcp
    restart: unless-stopped
    ports:
      - "33070:33070"
    environment:
      - ADMIN_PROCEDURES_HOST=0.0.0.0
      - ADMIN_PROCEDURES_PORT=33070
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================================
  # 5.5. AWS Aurora (MySQL互換) / RDS (MariaDB・MySQL) IAM 認証 MCP サーバー
  #      デフォルト DB_AUTH_MODE=sandbox_sim でローカル test_mariadb へ安全接続 (AWS課金0円)
  #      本番 EC2 環境では DB_AUTH_MODE=iam に切り替えて EC2 IAM ロール自動継承 + 15分トークン更新
  # ============================================================================
  aurora-rds-mcp:
    build:
      context: ./zta-mcp-stack/services/aurora-rds-mcp
      dockerfile: Dockerfile
    image: techies-t/aurora-rds-mcp:latest
    container_name: aurora-rds-mcp
    restart: unless-stopped
    ports:
      - "33080:33080"
    environment:
      - NODE_ENV=production
      - MCP_PORT=33080
      - MCP_HOST=0.0.0.0
      - DB_AUTH_MODE=${DB_AUTH_MODE:-sandbox_sim}
      - AURORA_RDS_ENGINE=${AURORA_RDS_ENGINE:-auto}
      - DB_READ_ONLY=${DB_READ_ONLY:-true}
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      - AURORA_RDS_HOST=${AURORA_RDS_HOST:-}
      - AURORA_RDS_PORT=${AURORA_RDS_PORT:-3306}
      - AURORA_RDS_USER=${AURORA_RDS_USER:-iam_readonly}
      - AURORA_RDS_DATABASE=${AURORA_RDS_DATABASE:-testdb}
      - AURORA_RDS_ROLE_ARN=${AURORA_RDS_ROLE_ARN:-}
      - DB_SSL_CA_PATH=${DB_SSL_CA_PATH:-/etc/ssl/certs/rds-global-bundle.pem}
      - DB_SSL_REJECT_UNAUTHORIZED=${DB_SSL_REJECT_UNAUTHORIZED:-true}
      - SANDBOX_DB_HOST=${SANDBOX_DB_HOST:-test_mariadb}
      - SANDBOX_DB_PORT=${SANDBOX_DB_PORT:-3306}
      - SANDBOX_DB_USER=${SANDBOX_DB_USER:-testuser}
      - SANDBOX_DB_PASSWORD=${SANDBOX_DB_PASSWORD:-testpassword}
      - SANDBOX_DB_NAME=${SANDBOX_DB_NAME:-testdb}
    depends_on:
      - test_mariadb
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================================
  # 6. Virtual Office PQC-Signed Plugin Service (Port 8091)
  # ============================================================================
  virtual-office-plugin:
    profiles:
      - plugin-service
    build:
      context: ../ea-widget-virtual-office
      dockerfile: Dockerfile
    image: techies-t/ea-widget-virtual-office:latest
    container_name: ea-widget-virtual-office
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    env_file:
      - server/development.env
    environment:
      - PORT=8091
      - DATA_DIR=/app/data
      - EA_CORE_INTERNAL_URL=http://macosui-local:8080
      - NODE_ENV=production
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================================
  # 7. MCP Chat Client PQC-Signed Plugin Service (Port 8092)
  # ============================================================================
  mcp-chat-plugin:
    profiles:
      - plugin-service
    build:
      context: ../ea-widget-mcp-chat
      dockerfile: Dockerfile
    image: techies-t/ea-widget-mcp-chat:latest
    container_name: ea-widget-mcp-chat
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8092"
    env_file:
      - server/development.env
    environment:
      - PORT=8092
      - DATA_DIR=/app/data
      - EA_CORE_INTERNAL_URL=http://macosui-local:8080
      - NODE_ENV=production
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================================
  # 7. EA-Plugin-Updater Sidecar (Zero-Trust One-Click Plugin Install & VUP)
  #    No external ports exposed. Only accessible from macosui-local via A2A JWT.
  # ============================================================================
  plugin-updater:
    build:
      context: ./plugin-updater
      dockerfile: Dockerfile
    image: techies-t/ea-plugin-updater:latest
    container_name: ea-plugin-updater
    restart: unless-stopped
    env_file:
      - server/development.env
    environment:
      - PORT=8099
      - CORE_CONTAINER_NAME=macosui-local
      - VERIFY_COSIGN=${VERIFY_COSIGN:-true}
      - NODE_ENV=production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - macosui

networks:
  default:
    driver: bridge
    enable_ipv6: true
    driver_opts:
      com.docker.network.driver.mtu: 1280
