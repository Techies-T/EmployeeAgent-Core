events {
    worker_connections 1024;
}

http {
    # タイムアウトの設定
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # ログフォーマット
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 大きなファイルのアップロード（Infographicのbase64等）を許可する
    client_max_body_size 50M;

    # 80番ポートへのアクセスはすべてHTTPS(443)にリダイレクト
    server {
        listen 80;
        server_name _;
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 443番ポート(HTTPS)の設定
    server {
        listen 443 ssl;
        server_name _;

        # Docker内部DNSリゾルバ（コンテナ再起動時のIP変化による502 Bad Gatewayや停止コンテナでの起動失敗を防止）
        resolver 127.0.0.11 valid=10s ipv6=off;

        # 証明書のパス (docker-compose で ./certbot を /etc/letsencrypt にマウント)
        ssl_certificate /etc/letsencrypt/live/macosui-staging.techiespod.co.jp/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/macosui-staging.techiespod.co.jp/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Node.js サーバーへのリバースプロキシ
        location / {
            set $web_upstream http://macosui-web:8080;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Knowledge Base & Gemma MCP Server / MCP Chat / Async Tasks ストリーミング専用リバースプロキシ
        location ~ ^/api/(mcp/knowledge/|mcp/gemma/|mcp/chat|mcp/tasks|mcp-chat/stream) {
            set $web_upstream http://macosui-web:8080;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE (Server-Sent Events) 向けの設定
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            chunked_transfer_encoding on;
        }

        # Agile-Agent-Staging へのリバースプロキシ
        location /agile-agent/ {
            set $agile_upstream http://agile-agent-staging:3001;
            rewrite ^/agile-agent/(.*)$ /$1 break;
            proxy_pass $agile_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ZTA-MCP-Gateway / AppRunner MCP Server へのリバースプロキシ
        location /app-server/ {
            set $app_upstream http://zta-mcp-gateway:8080;
            rewrite ^/app-server/(.*)$ /$1 break;
            proxy_pass $app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Docker Monitor MCP Server へのリバースプロキシ
        location /docker-monitor/ {
            set $docker_mon_upstream http://docker-monitor-mcp:8081;
            rewrite ^/docker-monitor/(.*)$ /$1 break;
            proxy_pass $docker_mon_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE (Server-Sent Events) 向けの設定
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            chunked_transfer_encoding on;
        }
    }
}
